  function updateRow(idx, field, val) {
    onChange(rows.map((r, i) => {
      if (i !== idx) return r;
      const updated = { ...r, [field]: val };
      // When species changes, clamp yc to the new species' maximum available
      if (field === 'species') {
        const maxYc = YC10_SPECIES.has(val) ? 10 : 8;
        if (updated.yc > maxYc) updated.yc = maxYc;
      }
      return updated;
    }));
  }
  function addRow() {
    const used = new Set(rows.map(r => r.species));
    const next = Object.keys(SPECIES_DATA).find(k => !used.has(k));
    if (!next) return;
    onChange([...rows, { species: next, pct: Math.max(0, remaining), yc: 4 }]);
  }
  function removeRow(idx) { if (rows.length>1) onChange(rows.filter((_,i)=>i!==idx)); }

  const cols = '1fr 78px 52px 1fr 26px';

  return (
    <div>
      {/* Headers */}
      <div style={{ display:'grid', gridTemplateColumns:cols, gap:8, marginBottom:8, paddingBottom:8, borderBottom:`1px solid ${S.border}` }}>
        <Label>Species</Label>
        <Label>Mix %</Label>
        <Label>Area ha</Label>
        <Label>Yield Class</Label>
        <div/>
      </div>

      {rows.map((row, idx) => {
        const ha = ((row.pct/100)*area).toFixed(2);
        return (
          <div key={idx} style={{ display:'grid', gridTemplateColumns:cols, gap:8, marginBottom:8, alignItems:'center' }}>
            <Select value={row.species} onChange={v=>updateRow(idx,'species',v)}
              options={Object.entries(SPECIES_DATA).map(([k,d])=>[k,`${d.label} (SG ${d.sg})`])} />

            <div style={{ position:'relative' }}>
              <input type="number" value={row.pct} min={0} max={100} step={1}
                onChange={e=>updateRow(idx,'pct',Math.max(0,Math.min(100,Number(e.target.value))))}
                style={{ ...iBase, paddingRight:22, textAlign:'right' }}
                onFocus={e=>e.target.style.borderColor=S.accent}
                onBlur={e=>e.target.style.borderColor=S.borderStrong} />
              <span style={{ position:'absolute', right:7, top:'50%', transform:'translateY(-50%)', fontFamily:S.font, fontSize:11, color:S.textDim, pointerEvents:'none' }}>%</span>
            </div>

            {/* Area ha — read-only, styled like a soft tag */}
            <div style={{ fontFamily:S.font, fontSize:12, color:S.textMuted, textAlign:'right', paddingRight:4 }}>{ha}</div>

            <Select value={row.yc} onChange={v=>updateRow(idx,'yc',Number(v))}
              options={ycOptionsFor(row.species)} />

            <button onClick={()=>removeRow(idx)} disabled={rows.length<=1}
              style={{ background:'transparent', border:'none', cursor:rows.length<=1?'default':'pointer', color:rows.length<=1?S.textDim:S.textMuted, fontSize:16, padding:0, lineHeight:1, display:'flex', alignItems:'center', justifyContent:'center' }}>×</button>
          </div>
        );
      })}

      {/* Footer */}
      <div style={{ display:'flex', justifyContent:'space-between', alignItems:'center', padding:'10px 0 8px', marginTop:4, borderTop:`1px solid ${S.borderStrong}` }}>
        <button onClick={addRow} disabled={rows.length>=Object.keys(SPECIES_DATA).length}
          style={{ background:S.surface, border:`1px solid ${S.borderStrong}`, borderRadius:6, padding:'5px 12px', fontFamily:S.fontSans, fontSize:11, fontWeight:600, letterSpacing:'0.05em', textTransform:'uppercase', color:S.textMuted, cursor:'pointer', transition:'all 0.15s' }}
          onMouseEnter={e=>{e.currentTarget.style.borderColor=S.accent; e.currentTarget.style.color=S.accent;}}
          onMouseLeave={e=>{e.currentTarget.style.borderColor=S.borderStrong; e.currentTarget.style.color=S.textMuted;}}>
          + Add species
        </button>
        <div style={{ display:'flex', alignItems:'center', gap:8 }}>
          <span style={{ fontFamily:S.fontSans, fontSize:11, color:S.textMuted }}>Total</span>
          <span style={{ fontFamily:S.font, fontSize:14, color: valid?S.accent : Math.abs(remaining)>10?S.red:S.amber }}>
            {totalPct.toFixed(1)}%
          </span>
          {!valid && <span style={{ fontFamily:S.fontSans, fontSize:10, color:remaining>0?S.amber:S.red }}>
            {remaining>0 ? `${remaining.toFixed(1)}% unallocated` : `${Math.abs(remaining).toFixed(1)}% over`}
          </span>}
          {valid && !coniferOver && <Pill>balanced</Pill>}
          {valid && coniferOver && (
            <Pill color={S.red} bg={S.redDim}>§11.1 cap exceeded</Pill>
          )}
        </div>
      </div>

      {/* Progress bar — turns red when conifer cap exceeded */}
      <div style={{ height:2, background:S.border, borderRadius:1, overflow:'hidden' }}>
        <div style={{ height:'100%', borderRadius:1, transition:'width 0.3s, background 0.3s', width:`${Math.min(100,totalPct)}%`, background: coniferOver ? S.red : valid ? S.accent : totalPct>100 ? S.red : S.amber }} />
      </div>

      {/* Conifer cap warning strip — appears only when cap exceeded */}
      {coniferOver && (
        <div style={{ marginTop:10, padding:'10px 14px', background:S.redDim, border:`1px solid ${S.red}25`, borderRadius:6, display:'flex', justifyContent:'space-between', alignItems:'center' }}>
          <div>
            <div style={{ fontFamily:S.fontSans, fontSize:11, fontWeight:600, color:S.red, marginBottom:3 }}>
              Protocol Violation — MNS-M01 §11.1
            </div>
            <div style={{ fontFamily:S.fontSans, fontSize:10, color:S.red, opacity:0.8 }}>
              Scots Pine and Yew combined must not exceed 20% of planted stems. Reduce by {(coniferPct - 20).toFixed(1)}%.
            </div>
          </div>
          <div style={{ fontFamily:S.font, fontSize:18, fontWeight:500, color:S.red, marginLeft:16, whiteSpace:'nowrap' }}>
            {coniferPct.toFixed(1)}<span style={{ fontSize:11, marginLeft:3 }}>/ 20%</span>
          </div>
        </div>
      )}

      {/* SG sourcing footnote */}
      <div style={{ marginTop:14, paddingTop:12, borderTop:`1px solid ${S.border}` }}>
        <span style={{ fontFamily:S.fontSans, fontSize:10, color:S.textDim, lineHeight:1.6 }}>
          * Each SG (Specific Gravity) was selected based on a Jurisdictional Authority first, and Conservativeness second approach. Primary source: UK Woodland Carbon Code (WCC) lookup tables. Secondary source: Global Wood Density Database (Chave et al.) and IPCC 2006 GLs Table 4.13.
        </span>
      </div>
    </div>
  );
}

// ── Main App ───────────────────────────────────────────────────────────────
function App() {
  const [area, setArea] = useState(8);
  const [vintageYear, setVintageYear] = useState(5);
  const [speciesMix, setSpeciesMix] = useState([
    { species:'oak', pct:60, yc:4 },
    { species:'birch', pct:25, yc:6 },
    { species:'hazel', pct:15, yc:4 },
  ]);
  const [targetStems, setTargetStems] = useState(2500);
  const [actualStems, setActualStems] = useState(2100);
  const [uncertaintyRates, setUncertaintyRates] = useState({});
  const [uncertaintyScheduleRef, setUncertaintyScheduleRef] = useState('');
  const [bufferRate, setBufferRate] = useState(20);
  const [bufferApprovalRef, setBufferApprovalRef] = useState('');
  const [baselineChange, setBaselineChange] = useState(0);
  const [fuelLiters, setFuelLiters] = useState(0);
  const [fuelType, setFuelType] = useState('gas_oil');
  const [customFuelFactor, setCustomFuelFactor] = useState('');
  const [customFuelFactorRef, setCustomFuelFactorRef] = useState('');
  const [soilType, setSoilType] = useState('none');
  const [disturbedArea, setDisturbedArea] = useState(0);
  const [clearedAGB, setClearedAGB] = useState(0);
  const [clearedBGB, setClearedBGB] = useState(0);
  const [burned, setBurned] = useState(false);
  const [burnFactor, setBurnFactor] = useState('');
  const [burnFactorRef, setBurnFactorRef] = useState('');
  const [displacedLivestock, setDisplacedLivestock] = useState(0);
  const [cropProductionDisplaced, setCropProductionDisplaced] = useState(false);
  const [livestockLabel, setLivestockLabel] = useState('upland_sheep');
  const [livestockEF, setLivestockEF] = useState('');
  const [livestockEFRef, setLivestockEFRef] = useState('');
  const [safeHarbor, setSafeHarbor] = useState('none');
  const [safeHarborEvidence, setSafeHarborEvidence] = useState('');
  const [receivingDensityIncrease, setReceivingDensityIncrease] = useState(0);
  const [marketLFSource, setMarketLFSource] = useState('default');
  const [marketLFPercent, setMarketLFPercent] = useState('');
  const [marketLFRef, setMarketLFRef] = useState('');
  const [browsedScrub, setBrowsedScrub] = useState(false);
  const [browsingEvidence, setBrowsingEvidence] = useState('');
  const [prevDeficit, setPrevDeficit] = useState(0);
  const [reversalDetected, setReversalDetected] = useState(false);

  const totalPct = speciesMix.reduce((s, r) => s + Number(r.pct || 0), 0);
  const mixValid = Math.abs(totalPct - 100) < 0.1;
  const coniferPct = speciesMix.filter(r => r.species === 'scots_pine' || r.species === 'yew').reduce((s, r) => s + Number(r.pct || 0), 0);
  const ashPct = speciesMix.filter(r => r.species === 'ash').reduce((s, r) => s + Number(r.pct || 0), 0);
  const understoryKeys = new Set(['hazel','hawthorn','holly','bird_cherry','blackthorn','crab_apple','elder','guelder','goat_willow','rowan']);
  const understoryPct = speciesMix.filter(r => understoryKeys.has(r.species)).reduce((s, r) => s + Number(r.pct || 0), 0);
  const survivalRatio = targetStems > 0 ? actualStems / targetStems : 0;
  const spf = survivalRatio >= 0.8 ? 1 : survivalRatio < 0.5 ? 0 : survivalRatio;
  const densityFactor = Math.min(1, Math.max(0, targetStems) / 2500);
  const standardFuelFactors = { diesel: 0.0025835, gas_oil: 0.0027554 };
  const fuelFactor = fuelType === 'custom'
    ? (customFuelFactor !== '' && Number.isFinite(Number(customFuelFactor)) && Number(customFuelFactor) > 0 ? Number(customFuelFactor) : null)
    : standardFuelFactors[fuelType];
  const fuelFactorLabel = fuelType === 'gas_oil' ? 'Gas oil / red diesel, 2026' : fuelType === 'diesel' ? 'Diesel (forecourt), 2026' : 'Custom factor';
  const clearedDryTonnes = Math.max(0, Number(clearedAGB || 0)) + Math.max(0, Number(clearedBGB || 0));
  const livestockEFNum = livestockEF !== '' && Number.isFinite(Number(livestockEF)) && Number(livestockEF) > 0 ? Number(livestockEF) : null;
  const burnFactorNum = burnFactor !== '' && Number.isFinite(Number(burnFactor)) && Number(burnFactor) >= 0 ? Number(burnFactor) : null;
  const marketLFNum = marketLFSource === 'default'
    ? 0.40
    : (marketLFPercent !== '' && Number.isFinite(Number(marketLFPercent)) && Number(marketLFPercent) >= 0 && Number(marketLFPercent) <= 100 ? Number(marketLFPercent) / 100 : null);
  const safeHarborEvidencePresent = safeHarborEvidence.trim().length > 0;
  const safeHarborValid = safeHarbor === 'historical_absence'
    ? (displacedLivestock === 0 && safeHarborEvidencePresent)
    : safeHarbor === 'permanent_reduction'
      ? (displacedLivestock > 0 && safeHarborEvidencePresent)
      : safeHarbor === 'relocation'
        ? (displacedLivestock > 0 && safeHarborEvidencePresent && receivingDensityIncrease <= 10)
        : false;
  const marketLeakageApplies = safeHarbor === 'permanent_reduction' && safeHarborValid && displacedLivestock > 0;

  const projectStockAt = (year) => {
    if (year <= 0 || spf === 0 || targetStems <= 0) return { total: 0, volume: 0, species: [] };
    let total = 0;
    let totalVolume = 0;
    const species = speciesMix.map(row => {
      const ha = (Number(row.pct) / 100) * area;
      const volumePerHa = UKFC[row.species]?.[row.yc]?.[year] ?? 0;
      const volume = volumePerHa * densityFactor * spf * ha;
      const agb = volume * SPECIES_DATA[row.species].sg * BEF;
      const useBurrell = browsedScrub && browsingEvidence.trim() && BURRELL_RS_SPECIES.has(row.species);
      const rs = useBurrell ? BURRELL_RS : R2S;
      const stock = (agb + agb * rs) * CF * STOICH;
      total += stock;
      totalVolume += volume;
      return { ...row, ha, volumePerHa, volume, agb, rs, stock };
    });
    return { total, volume: totalVolume, species };
  };

  const currentStock = projectStockAt(vintageYear);
  const previousStock = vintageYear === 5 ? { total: 0, volume: 0, species: speciesMix.map(r => ({ ...r, stock: 0, volume: 0, volumePerHa: 0, ha: area * Number(r.pct) / 100 })) } : projectStockAt(vintageYear - 5);
  const speciesBreakdown = currentStock.species.map((row, i) => {
    const previous = previousStock.species[i];
    return {
      ...row,
      previousStock: previous ? previous.stock : 0,
      deltaStock: row.stock - (previous ? previous.stock : 0),
      uncertaintyPct: uncertaintyRates[`${row.species}:${row.yc}`] === undefined ? '' : uncertaintyRates[`${row.species}:${row.yc}`],
    };
  });
  const projectStockChange = speciesBreakdown.reduce((s, r) => s + r.deltaStock, 0);
  const uncertaintyRatesComplete = speciesMix.every(row => {
    const rate = uncertaintyRates[`${row.species}:${row.yc}`];
    return rate !== undefined && rate !== '' && Number.isFinite(Number(rate)) && Number(rate) >= 0 && Number(rate) <= 100;
  }) && uncertaintyScheduleRef.trim().length > 0;
  const uncertaintyDeduction = uncertaintyRatesComplete
    ? speciesBreakdown.reduce((s, r) => s + Math.max(0, r.deltaStock) * (Number(r.uncertaintyPct) / 100), 0)
    : null;

  const baselineDeduction = Math.max(0, Number(baselineChange || 0));
  const projectFuelEmissions = fuelFactor === null ? null : Math.max(0, fuelLiters) * fuelFactor;
  const soilFactor = soilType === 'mineral' ? 0.05 : soilType === 'organo' ? 0.15 : 0;
  const soilDeduction = vintageYear === 5 && soilType !== 'none' && area > 0 && disturbedArea >= 0 && disturbedArea <= area
    ? Math.max(0, projectStockChange) * soilFactor * (disturbedArea / area)
    : 0;
  const clearanceEmission = vintageYear === 5 ? clearedDryTonnes * CF * STOICH : 0;
  const burningExtraEmissions = vintageYear === 5 && burned && clearedDryTonnes > 0 && burnFactorNum !== null
    ? clearedDryTonnes * burnFactorNum
    : (vintageYear === 5 && burned && clearedDryTonnes > 0 ? null : 0);
  const livestockBaseEmissions = livestockEFNum === null ? null : Math.max(0, displacedLivestock) * livestockEFNum * 10;
  const activityLeakage = displacedLivestock <= 0 ? 0 : (livestockBaseEmissions === null ? null : (safeHarborValid ? 0 : livestockBaseEmissions));
  const marketLeakage = !marketLeakageApplies ? 0 : (livestockBaseEmissions === null || marketLFNum === null ? null : livestockBaseEmissions * marketLFNum);

  const emissionsComplete =
    (fuelLiters <= 0 || projectFuelEmissions !== null) &&
    !(vintageYear === 5 && burned && clearedDryTonnes > 0 && (burnFactorNum === null || !burnFactorRef.trim())) &&
    (displacedLivestock <= 0 || (livestockEFNum !== null && livestockEFRef.trim().length > 0)) &&
    !(marketLeakageApplies && marketLFSource !== 'default' && (marketLFNum === null || !marketLFRef.trim())) &&
    !(fuelType === 'custom' && fuelLiters > 0 && (!customFuelFactorRef.trim() || fuelFactor === null));
  const soilInputValid = !(vintageYear === 5 && soilType !== 'none' && (disturbedArea <= 0 || disturbedArea > area));
  const bufferRefValid = bufferRate >= 20 || bufferApprovalRef.trim().length > 0;
  const browsingRefValid = !browsedScrub || browsingEvidence.trim().length > 0;
  const netCalculationComplete = uncertaintyRatesComplete && emissionsComplete && soilInputValid && bufferRefValid && browsingRefValid && fuelLiters >= 0;

  // MNS-M01 §10.1: rate base is calculated after baseline, project emissions,
  // leakage and initial clearance deductions, but before the uncertainty deduction.
  const preBufferBalance = emissionsComplete && soilInputValid
    ? projectStockChange - baselineDeduction - (projectFuelEmissions || 0) - soilDeduction - clearanceEmission - (burningExtraEmissions || 0) - (activityLeakage || 0) - (marketLeakage || 0)
    : null;
  const bufferBase = preBufferBalance === null ? null : Math.max(0, preBufferBalance);
  const bufferVolume = bufferBase === null ? null : bufferBase * (bufferRate / 100);
  const netBeforeCarryover = netCalculationComplete && uncertaintyDeduction !== null && bufferVolume !== null
    ? projectStockChange - baselineDeduction - (projectFuelEmissions || 0) - soilDeduction - clearanceEmission - (burningExtraEmissions || 0) - (activityLeakage || 0) - (marketLeakage || 0) - uncertaintyDeduction - bufferVolume
    : null;
  const balanceAfterDeficit = netBeforeCarryover === null ? null : netBeforeCarryover - Math.max(0, prevDeficit);
  const newDeficit = balanceAfterDeficit === null ? null : (balanceAfterDeficit <= 0 ? Math.abs(balanceAfterDeficit) : 0);
  const provisionalUnits = balanceAfterDeficit === null ? null : Math.max(0, balanceAfterDeficit);

  const screenIssues = [];
  if (!mixValid) screenIssues.push(`Species mix totals ${totalPct.toFixed(1)}%; it must total 100%.`);
  if (area <= 0) screenIssues.push('Net planted area must be greater than zero.');
  if (targetStems <= 0) screenIssues.push('Target planting density must be greater than zero.');
  if (targetStems > 2500) screenIssues.push('Initial planting density exceeds the 2,500 stems/ha limit in MNS-M01 §11.3.');
  if (coniferPct > 20) screenIssues.push('Scots Pine and Yew exceed the 20% cap in MNS-M01 §11.1.');
  if (ashPct > 2) screenIssues.push('Ash exceeds the 2% cap in MNS-M01 §11.1.');
  if (understoryPct < 15) screenIssues.push('The species mix contains less than 15% designated understory species. Verify the actual surviving stems at verification.');
  if (spf === 0) screenIssues.push('Survival is below 50% of the target density. Module A issuance is blocked until replanting and a subsequent establishment audit.');
  if (!soilInputValid) screenIssues.push('Enter a positive disturbed area no greater than the net planted area for Year 5 mechanical soil preparation.');
  if (reversalDetected) screenIssues.push('A reversal or major disturbance was reported. Do not use Module A yield tables for the affected stratum; quantify remaining stocks under Module B.');
  if (cropProductionDisplaced) screenIssues.push('This calculator models livestock leakage only. Crop-production displacement requires a separate approved leakage calculation.');
  if (browsedScrub && !browsingEvidence.trim()) screenIssues.push('Add the evidence reference before applying the alternative root-to-shoot ratio.');

  const missingInputs = [];
  if (!uncertaintyScheduleRef.trim()) missingInputs.push('Registry-approved Module A uncertainty schedule reference');
  speciesMix.forEach(row => {
    const key = `${row.species}:${row.yc}`;
    const value = uncertaintyRates[key];
    if (value === undefined || value === '' || !Number.isFinite(Number(value)) || Number(value) < 0 || Number(value) > 100) {
      missingInputs.push(`Approved uncertainty rate for ${SPECIES_DATA[row.species].label}, YC ${row.yc}`);
    }
  });
  if (fuelLiters > 0 && fuelFactor === null) missingInputs.push('Valid fuel emission factor');
  if (fuelLiters > 0 && fuelType === 'custom' && !customFuelFactorRef.trim()) missingInputs.push('Fuel factor source/version reference');
  if (vintageYear === 5 && burned && clearedDryTonnes > 0 && burnFactorNum === null) missingInputs.push('Approved additional CH₄/N₂O combustion factor');
  if (vintageYear === 5 && burned && clearedDryTonnes > 0 && !burnFactorRef.trim()) missingInputs.push('IPCC Tier 1 combustion factor source/version');
  if (displacedLivestock > 0 && livestockEFNum === null) missingInputs.push('Species-specific livestock emission factor');
  if (displacedLivestock > 0 && !livestockEFRef.trim()) missingInputs.push('Livestock emission factor source/version');
  if (marketLeakageApplies && marketLFSource !== 'default' && marketLFNum === null) missingInputs.push('Empirically derived market leakage fraction');
  if (marketLeakageApplies && marketLFSource !== 'default' && !marketLFRef.trim()) missingInputs.push('Market elasticity evidence/source reference');
  if (bufferRate < 20 && !bufferApprovalRef.trim()) missingInputs.push('Approval reference for a buffer rate below 20%');

  const fmt = (n, d = 2) => (n !== undefined && n !== null && Number.isFinite(Number(n))) ? Number(n).toFixed(d) : '—';
  const spfStatus = spf === 0 ? 'FAIL' : spf < 1 ? `${(spf * 100).toFixed(0)}%` : 'PASS';
  const spfColor = spf === 0 ? S.red : spf < 1 ? S.amber : S.accent;
  const allRequiredInputsPresent = missingInputs.length === 0 && netCalculationComplete;
  const resultScreenPasses = screenIssues.length === 0;

  function exportResults() {
    const payload = {
      calculator: 'MNS Module A Calculator',
      status: 'Preliminary estimate only. Not an issuance approval.',
      exportedAt: new Date().toISOString(),
      methodologyVersion: 'MNS-M01 v0.2.5 draft',
      inputs: {
        netPlantedAreaHa: area, vintageYear, speciesMix, targetStems, actualStems,
        uncertaintyRates, uncertaintyScheduleRef, bufferRate, bufferApprovalRef,
        baselineChangeTCO2e: baselineChange, fuelLiters, fuelType, fuelFactorTCO2ePerLitre: fuelFactor,
        soilType, disturbedAreaHa: disturbedArea, clearedAGBDryTonnes: clearedAGB, clearedBGBDryTonnes: clearedBGB,
        burned, burnFactorTCO2ePerDryTonne: burnFactor, burnFactorRef,
        displacedLivestock, cropProductionDisplaced, livestockLabel, livestockEF, livestockEFRef, safeHarbor,
        safeHarborEvidence, receivingDensityIncreasePct: receivingDensityIncrease,
        marketLFSource, marketLFPercent, marketLFRef, browsedScrub, browsingEvidence,
        previousDeficitTCO2e: prevDeficit, reversalDetected
      },
      results: {
        currentProjectStockTCO2e: currentStock.total,
        previousProjectStockTCO2e: previousStock.total,
        projectStockChangeTCO2e: projectStockChange,
        baselineDeductionTCO2e: baselineDeduction,
        projectFuelEmissionsTCO2e: projectFuelEmissions,
        soilDisturbanceDeductionTCO2e: soilDeduction,
        preProjectClearanceEmissionsTCO2e: clearanceEmission,
        additionalBurningEmissionsTCO2e: burningExtraEmissions,
        activityShiftingLeakageTCO2e: activityLeakage,
        marketLeakageTCO2e: marketLeakage,
        uncertaintyDeductionTCO2e: uncertaintyDeduction,
        bufferRatePct: bufferRate,
        bufferVolumeTCO2e: bufferVolume,
        netBeforeCarryoverTCO2e: netBeforeCarryover,
        previousDeficitTCO2e: prevDeficit,
        newDeficitTCO2e: newDeficit,
        indicativeUnitsAfterDeficit: provisionalUnits
      },
      screeningIssues: screenIssues,
      missingInputs
    };
    const blob = new Blob([JSON.stringify(payload, null, 2)], { type: 'application/json' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = `mns-calculator-vintage-${vintageYear}-estimate.json`;
    document.body.appendChild(a);
    a.click();
    a.remove();
    URL.revokeObjectURL(url);
  }

  const tabBtn = {
    background: S.surface, border:`1px solid ${S.borderStrong}`, borderRadius:6,
    padding:'6px 14px', fontFamily:S.fontSans, fontSize:12, fontWeight:500,
    color:S.textMuted, cursor:'default', letterSpacing:'-0.01em',
  };
  const inputStyle = { ...iBase };
  const factorSourceUrl = 'https://www.gov.uk/government/publications/greenhouse-gas-reporting-conversion-factors-2026';

  return (
    <div style={{ minHeight:'100vh', background:S.bg, fontFamily:S.fontSans, color:S.text }}>
      <div style={{ background:S.surface, borderBottom:`1px solid ${S.border}`, padding:'0 32px', display:'flex', alignItems:'center', justifyContent:'space-between', minHeight:56, position:'sticky', top:0, zIndex:20, gap:12, flexWrap:'wrap' }}>
        <div style={{ display:'flex', alignItems:'center', gap:12, flexWrap:'wrap' }}>
          <div style={{ display:'flex', alignItems:'center', gap:8 }}>
            <div style={{ width:8, height:8, borderRadius:'50%', background:S.accent }} />
            <span style={{ fontFamily:S.fontHead, fontSize:15, fontWeight:600, color:S.text }}>MNS Standard</span>
          </div>
          <div style={{ width:1, height:20, background:S.border, margin:'0 4px' }} />
          <button style={{ ...tabBtn, color:S.text, borderColor:S.borderStrong, background:S.surface }}>Module A — Woodland Creation</button>
        </div>
        <Pill color={S.amber} bg={S.amberDim}>Preliminary estimate only</Pill>
      </div>
      <div style={{ background:S.surface, borderBottom:`1px solid ${S.border}`, padding:'8px 32px', display:'flex', alignItems:'center', gap:22, flexWrap:'wrap' }}>
        {[['Protocol','MNS-M01'],['Method','Module A yield curves'],['Factor set','UK Government 2026'],['Registry','Isle of Man']].map(([k,v]) => (
          <div key={k} style={{ display:'flex', alignItems:'center', gap:7 }}><Label>{k}</Label><span style={{ fontFamily:S.font, fontSize:11, color:S.textMuted }}>{v}</span></div>
        ))}
      </div>

      <div id="calc-layout" style={{ display:'grid', gridTemplateColumns:'minmax(0,1fr) 420px', minHeight:'calc(100vh - 94px)' }}>
        <div style={{ padding:'28px 32px', borderRight:`1px solid ${S.border}`, display:'flex', flexDirection:'column', gap:20, minWidth:0 }}>
          <div style={{ padding:'12px 16px', background:S.amberDim, border:`1px solid ${S.amber}35`, borderRadius:6, fontSize:12, lineHeight:1.55, color:S.textMuted }}>
            <strong style={{ color:S.amber }}>Estimate only.</strong> This file still contains proxy yield curves for some species. Outputs are not suitable for issuance until the Registry-approved yield data, uncertainty schedule and project inputs have been validated. For projects with distinct monitoring strata, calculate each stratum separately and aggregate under approved Registry rules. The calculator does not approve credits.
          </div>

          <Card>
            <SectionHeader>Site Profile</SectionHeader>
            <div style={{ display:'grid', gridTemplateColumns:'1fr 1fr', gap:16 }}>
              <Field label="Net planted area (ha)" note="Enter planted area after excluding open space.">
                <NumInput value={area} onChange={setArea} min={0.1} step={0.1} />
              </Field>
              <Field label="Verification vintage">
                <Select value={vintageYear} onChange={v=>setVintageYear(Number(v))} options={VINTAGE_YEARS.map(y=>[y,y===5?'Year 5 — first verification':y===50?'Year 50 — final vintage':`Year ${y}`])} />
              </Field>
              <Field label="Verified baseline stock change (tCO₂e)" note="Enter the change for this vintage. Negative changes give no baseline deduction.">
                <NumInput value={baselineChange} onChange={setBaselineChange} step={0.1} />
              </Field>
              <Field label="Previous carbon deficit (tCO₂e)" note="Carry-forward deficit from the previous verification record.">
                <NumInput value={prevDeficit} onChange={setPrevDeficit} min={0} step={0.1} />
              </Field>
            </div>
          </Card>

          <Card>
            <SectionHeader>Species Mix and Yield Class</SectionHeader>
            <SpeciesMixMatrix rows={speciesMix} onChange={setSpeciesMix} area={area} coniferPct={coniferPct} />
            <div style={{ marginTop:14, paddingTop:12, borderTop:`1px solid ${S.border}`, fontSize:11, color:S.textMuted, lineHeight:1.6 }}>
              Species percentages are used to allocate the net planted area and modelled biomass. The calculator screens the conifer and ash limits and an indicative understory mix; the VVB must verify actual surviving stems and full ecological eligibility.
            </div>
          </Card>

          <Card>
            <SectionHeader>Year 5 Establishment Audit</SectionHeader>
            <div style={{ display:'grid', gridTemplateColumns:'1fr 1fr', gap:16 }}>
              <Field label="Target planting density (stems/ha)" note="Must not exceed 2,500 stems/ha.">
                <NumInput value={targetStems} onChange={setTargetStems} min={1} max={2500} step={1} />
              </Field>
              <Field label="Verified surviving stems/ha" note="Used to calculate the Module A stocking penalty factor.">
                <NumInput value={actualStems} onChange={setActualStems} min={0} step={1} />
              </Field>
            </div>
            <div style={{ marginTop:12, display:'flex', alignItems:'center', justifyContent:'space-between', background:spfColor===S.red?S.redDim:spfColor===S.amber?S.amberDim:S.accentDim, border:`1px solid ${spfColor}25`, borderRadius:6, padding:'10px 14px', gap:12 }}>
              <div>
                <div style={{ fontSize:12, color:spfColor, fontWeight:600 }}>Stocking penalty factor (SPF)</div>
                <div style={{ fontSize:10, color:S.textMuted, marginTop:3 }}>Density scaling factor: {(densityFactor*100).toFixed(0)}% of the 2,500 stems/ha reference.</div>
              </div>
              <Pill color={spfColor} bg={spfColor+'15'}>{spfStatus}</Pill>
            </div>
            {spf===0 && <div style={{ marginTop:10, color:S.red, fontSize:11, lineHeight:1.5 }}>Survival is below 50% of target. Module A issuance is blocked until replanting and a subsequent establishment audit.</div>}
          </Card>

          <Card>
            <SectionHeader>Uncertainty Schedule</SectionHeader>
            <div style={{ fontSize:11, color:S.textMuted, lineHeight:1.55, marginBottom:12 }}>
              Enter the approved deduction for each species and yield-class combination from the Registry schedule. No zero-rate default is assumed. A schedule reference and a rate for every active combination are required to calculate the final vintage balance.
            </div>
            <Field label="Approved Registry uncertainty schedule reference">
              <input type="text" value={uncertaintyScheduleRef} onChange={e=>setUncertaintyScheduleRef(e.target.value)} placeholder="Schedule ID / version" style={inputStyle} />
            </Field>
            <div style={{ display:'grid', gridTemplateColumns:'minmax(0,1fr) 110px', gap:8, marginTop:14, paddingBottom:7, borderBottom:`1px solid ${S.border}` }}>
              <Label>Species · Yield class</Label><Label>Deduction (%)</Label>
            </div>
            {speciesMix.map((row, i) => {
              const key = `${row.species}:${row.yc}`;
              const value = uncertaintyRates[key] === undefined ? '' : uncertaintyRates[key];
              return <div key={`${key}-${i}`} style={{ display:'grid', gridTemplateColumns:'minmax(0,1fr) 110px', gap:8, alignItems:'center', padding:'7px 0', borderBottom:`1px solid ${S.border}` }}>
                <span style={{ fontSize:12, color:S.text }}>{SPECIES_DATA[row.species].label} · YC {row.yc}</span>
                <input type="number" min="0" max="100" step="0.1" value={value} onChange={e=>setUncertaintyRates(old=>({...old,[key]:e.target.value===''?'':Number(e.target.value)}))} placeholder="Required" style={{ ...iBase, textAlign:'right', padding:'7px 8px' }} />
              </div>;
            })}
          </Card>

          <Card>
            <SectionHeader>Buffer Contribution</SectionHeader>
            <div style={{ display:'grid', gridTemplateColumns:'1fr 1fr', gap:16 }}>
              <Field label="Approved buffer contribution rate (%)" note="Enter the rate returned by MNS-RM01. This field does not grant approval.">
                <Select value={bufferRate} onChange={v=>setBufferRate(Number(v))} options={[[12,'12%'],[14,'14%'],[16,'16%'],[18,'18%'],[20,'20% — default']]} />
              </Field>
              <Field label="Approval record reference" note="Required when applying a rate below 20%.">
                <input type="text" value={bufferApprovalRef} onChange={e=>setBufferApprovalRef(e.target.value)} placeholder={bufferRate<20?'Required for <20%':'Optional at 20%'} style={inputStyle} />
              </Field>
            </div>
            <div style={{ marginTop:12, fontSize:11, color:S.textMuted, lineHeight:1.55 }}>
              The buffer volume is calculated from the positive balance after baseline, project-emission, leakage and applicable initial-clearance deductions, but before the uncertainty deduction. The rate and the volume withheld are recorded separately.
            </div>
          </Card>

          <Card>
            <SectionHeader>Project Emissions</SectionHeader>
            <div style={{ display:'grid', gridTemplateColumns:'1fr 1fr', gap:16 }}>
              <Field label="Fuel used in this vintage (litres)" note="Use fuel records for the current five-year period.">
                <NumInput value={fuelLiters} onChange={setFuelLiters} min={0} step={1} />
              </Field>
              <Field label="Fuel type / conversion factor">
                <Select value={fuelType} onChange={setFuelType} options={[["gas_oil","Gas oil / red diesel · 2026"],["diesel","Diesel (forecourt) · 2026"],["custom","Other / custom factor"]]} />
              </Field>
              {fuelType==='custom' && <>
                <Field label="Custom factor (tCO₂e/litre)"><input type="number" min="0" step="0.000001" value={customFuelFactor} onChange={e=>setCustomFuelFactor(e.target.value)} placeholder="Enter approved factor" style={inputStyle} /></Field>
                <Field label="Factor source/version"><input type="text" value={customFuelFactorRef} onChange={e=>setCustomFuelFactorRef(e.target.value)} placeholder="Source and year" style={inputStyle} /></Field>
              </>}
              <Field label="Soil preparation">
                <Select value={soilType} onChange={setSoilType} options={[["none","No mechanical preparation"],["mineral","Mechanical preparation — mineral soil (5%)"],["organo","Mechanical preparation — organo-mineral / shallow peat (15%)"]]} />
              </Field>
              <Field label="Area mechanically disturbed (ha)" note="Applied only to the Year 5 soil disturbance deduction.">
                <NumInput value={disturbedArea} onChange={setDisturbedArea} min={0} step={0.1} max={area} />
              </Field>
              <Field label="Cleared above-ground biomass (dry tonnes)" note="Pre-project biomass; deducted only at Year 5.">
                <NumInput value={clearedAGB} onChange={setClearedAGB} min={0} step={0.1} />
              </Field>
              <Field label="Cleared below-ground biomass (dry tonnes)" note="Enter where root biomass is removed and must be accounted for.">
                <NumInput value={clearedBGB} onChange={setClearedBGB} min={0} step={0.1} />
              </Field>
            </div>
            {clearedDryTonnes>0 && vintageYear===5 && <div style={{ marginTop:14, paddingTop:12, borderTop:`1px solid ${S.border}` }}>
              <Toggle checked={burned} onChange={setBurned} label="Pre-project biomass burned on-site" />
              {burned && <div style={{ display:'grid', gridTemplateColumns:'1fr 1fr', gap:16, marginTop:12 }}>
                <Field label="Additional CH₄/N₂O factor (tCO₂e / dry tonne)" note="Additional non-CO₂ emissions only; enter the approved Tier 1 combined factor.">
                  <input type="number" min="0" step="0.0001" value={burnFactor} onChange={e=>setBurnFactor(e.target.value)} placeholder="Required" style={inputStyle} />
                </Field>
                <Field label="IPCC Tier 1 source/version">
                  <input type="text" value={burnFactorRef} onChange={e=>setBurnFactorRef(e.target.value)} placeholder="Source and version" style={inputStyle} />
                </Field>
              </div>}
            </div>}
            <div style={{ marginTop:12, fontSize:10, color:S.textDim, lineHeight:1.55 }}>
              Built-in direct combustion factors use the 2026 UK Government conversion-factor set: gas oil/red diesel 0.0027554 tCO₂e/litre; forecourt diesel 0.0025835 tCO₂e/litre. Check the appropriate factor for the fuel and reporting period before use. <a href={factorSourceUrl} target="_blank" rel="noreferrer" style={{ color:S.accent }}>Official conversion factors</a>.
            </div>
          </Card>

          <Card>
            <SectionHeader>Livestock Leakage</SectionHeader>
            <div style={{ fontSize:11, color:S.textMuted, lineHeight:1.55, marginBottom:12 }}>This section calculates livestock leakage. If crop production is displaced, use a separate approved calculation; this calculator does not quantify crop-production leakage.</div>
            <div style={{ display:'grid', gridTemplateColumns:'1fr 1fr', gap:16 }}>
              <Field label="Displaced livestock during this vintage (headcount)">
                <NumInput value={displacedLivestock} onChange={setDisplacedLivestock} min={0} step={1} />
              </Field>
              <Field label="Livestock type">
                <Select value={livestockLabel} onChange={setLivestockLabel} options={[["upland_sheep","Upland sheep"],["beef_cattle","Beef cattle"],["dairy_cattle","Dairy cattle"],["goat","Goats"],["other","Other livestock"]]} />
              </Field>
              {displacedLivestock>0 && <>
                <Field label="Tier 1 emission factor (tCO₂e/head/year)" note="Use the factor for the selected livestock type.">
                  <input type="number" min="0" step="0.0001" value={livestockEF} onChange={e=>setLivestockEF(e.target.value)} placeholder="Required" style={inputStyle} />
                </Field>
                <Field label="Livestock factor source/version">
                  <input type="text" value={livestockEFRef} onChange={e=>setLivestockEFRef(e.target.value)} placeholder="IPCC / DEFRA reference" style={inputStyle} />
                </Field>
              </>}
              <div style={{ gridColumn:'1 / -1' }}><Toggle checked={cropProductionDisplaced} onChange={setCropProductionDisplaced} label="Crop production is also displaced" /></div>
              <Field label="Leakage condition" style={{ gridColumn:'1 / -1' }}>
                <Select value={safeHarbor} onChange={setSafeHarbor} options={[["none","No safe harbour demonstrated"],["historical_absence","No grazing/crop production in preceding 5 years"],["permanent_reduction","Permanent herd reduction"],["relocation","Relocation without increased stocking density"]]} />
              </Field>
              {safeHarbor!=='none' && <Field label="Evidence record reference" style={{ gridColumn:'1 / -1' }}>
                <input type="text" value={safeHarborEvidence} onChange={e=>setSafeHarborEvidence(e.target.value)} placeholder="Record supporting the selected condition" style={inputStyle} />
              </Field>}
              {safeHarbor==='relocation' && <Field label="Change in receiving parcel LU/ha vs 5-year average (%)" style={{ gridColumn:'1 / -1' }} note="Must be no more than 10% for this safe harbour.">
                <NumInput value={receivingDensityIncrease} onChange={setReceivingDensityIncrease} step={0.1} />
              </Field>}
            </div>
            {marketLeakageApplies && <div style={{ marginTop:14, paddingTop:12, borderTop:`1px solid ${S.border}` }}>
              <div style={{ fontSize:12, color:S.text, fontWeight:600, marginBottom:10 }}>Market leakage</div>
              <div style={{ fontSize:11, color:S.textMuted, lineHeight:1.55, marginBottom:12 }}>Permanent herd reduction may remove activity-shifting leakage but can still displace production. Use a suitable local estimate, a suitable peer-reviewed UK proxy, or the 0.40 default if neither is available.</div>
              <div style={{ display:'grid', gridTemplateColumns:'1fr 1fr', gap:16 }}>
                <Field label="Leakage fraction source">
                  <Select value={marketLFSource} onChange={v=>setMarketLFSource(v)} options={[["iom","Isle of Man estimate"],["uk","Peer-reviewed UK proxy"],["default","No suitable estimate — use 40% default"]]} />
                </Field>
                {marketLFSource!=='default' && <Field label="Calculated leakage fraction (%)" note="Enter the fraction calculated from the documented elasticity evidence.">
                  <input type="number" min="0" max="100" step="0.1" value={marketLFPercent} onChange={e=>setMarketLFPercent(e.target.value)} placeholder="Required" style={inputStyle} />
                </Field>}
                {marketLFSource!=='default' && <Field label="Elasticity evidence/source reference" style={{ gridColumn:'1 / -1' }}>
                  <input type="text" value={marketLFRef} onChange={e=>setMarketLFRef(e.target.value)} placeholder="Commodity, source and justification for use in the Isle of Man" style={inputStyle} />
                </Field>}
              </div>
              <div style={{ marginTop:8, fontSize:11, color:S.textMuted }}>Applied leakage fraction: {marketLFNum===null?'—':`${(marketLFNum*100).toFixed(1)}%`}</div>
            </div>}
            {displacedLivestock>0 && safeHarbor==='historical_absence' && <div style={{ marginTop:10, color:S.amber, fontSize:11 }}>A positive displaced-livestock count conflicts with the historical-absence condition. Unless the condition is evidenced, the calculator applies the activity-shifting leakage deduction.</div>}
            {safeHarbor==='relocation' && receivingDensityIncrease>10 && <div style={{ marginTop:10, color:S.amber, fontSize:11 }}>The receiving parcel exceeds the 10% stocking-density limit. This does not qualify for the relocation safe harbour; activity-shifting leakage is applied.</div>}
          </Card>

          <Card>
            <SectionHeader>Other Methodology Conditions</SectionHeader>
            <div style={{ display:'flex', flexDirection:'column', gap:12 }}>
              <Toggle checked={browsedScrub} onChange={setBrowsedScrub} label="Apply alternative root-to-shoot ratio (1.07) to hawthorn, blackthorn and goat willow" />
              {browsedScrub && <Field label="Evidence/source reference">
                <input type="text" value={browsingEvidence} onChange={e=>setBrowsingEvidence(e.target.value)} placeholder="Evidence that supports the alternative ratio" style={inputStyle} />
              </Field>}
              <Toggle checked={reversalDetected} onChange={setReversalDetected} label="A reversal or major disturbance has affected a stratum" />
              {reversalDetected && <div style={{ color:S.red, fontSize:11, lineHeight:1.5 }}>Module A must not be used to estimate post-reversal stocks. Quantify the affected stratum under Module B before further issuance.</div>}
            </div>
          </Card>
        </div>

        <div id="calc-ledger" style={{ background:S.surfaceAlt, borderLeft:`1px solid ${S.border}`, position:'sticky', top:94, height:'calc(100vh - 94px)', overflowY:'auto', display:'flex', flexDirection:'column', minWidth:0 }}>
          <div style={{ padding:'18px 24px 16px', borderBottom:`1px solid ${S.border}`, background:S.surface }}>
            <div style={{ display:'flex', justifyContent:'space-between', alignItems:'center', gap:8 }}>
              <span style={{ fontSize:13, fontWeight:600, color:S.text }}>Vintage calculation</span>
              <Pill color={allRequiredInputsPresent?S.accent:S.amber} bg={allRequiredInputsPresent?S.accentDim:S.amberDim}>{allRequiredInputsPresent?'Inputs complete':'Inputs incomplete'}</Pill>
            </div>
            <div style={{ fontSize:11, color:S.textMuted, marginTop:5 }}>Year {vintageYear} · previous period {vintageYear===5?'Project start':`Year ${vintageYear-5}`}</div>
          </div>
          <div style={{ padding:'0 24px 28px', flex:1 }}>
            <div style={{ paddingTop:20, paddingBottom:16, borderBottom:`1px solid ${S.border}` }}>
              <div style={{ display:'flex', justifyContent:'space-between', alignItems:'flex-start', marginBottom:8, gap:8 }}>
                <div><div style={{ fontSize:12, color:S.textMuted }}>Current modelled stock</div><div style={{ fontSize:10, color:S.textDim }}>Cproject at Year {vintageYear}</div></div>
                <span style={{ fontFamily:S.font, fontSize:19, color:S.text }}>{fmt(currentStock.total)}<span style={{ fontSize:10, color:S.textDim, marginLeft:4 }}>tCO₂e</span></span>
              </div>
              <div style={{ display:'flex', justifyContent:'space-between', alignItems:'center', marginBottom:8, gap:8 }}>
                <span style={{ fontSize:12, color:S.textMuted }}>Previous modelled stock</span>
                <span style={{ fontFamily:S.font, fontSize:13, color:S.textMuted }}>{fmt(previousStock.total)} tCO₂e</span>
              </div>
              <div style={{ display:'flex', justifyContent:'space-between', alignItems:'center', paddingTop:10, borderTop:`1px solid ${S.borderStrong}`, gap:8 }}>
                <span style={{ fontSize:12, fontWeight:600, color:S.text }}>Change in project stocks</span>
                <span style={{ fontFamily:S.font, fontSize:17, color:projectStockChange>=0?S.accent:S.red }}>{fmt(projectStockChange)} tCO₂e</span>
              </div>
              <div style={{ marginTop:10 }}>
                <Label style={{ display:'block', marginBottom:6 }}>Species change</Label>
                {speciesBreakdown.map((r,i)=><div key={`${r.species}-${r.yc}-${i}`} style={{ display:'flex', justifyContent:'space-between', gap:10, padding:'5px 0', borderBottom:`1px solid ${S.border}` }}>
                  <div><div style={{ fontSize:11, color:S.text }}>{SPECIES_DATA[r.species].label}</div><div style={{ fontSize:9, color:S.textDim }}>{r.pct}% · {r.ha.toFixed(2)} ha · YC {r.yc}</div></div>
                  <span style={{ fontFamily:S.font, fontSize:11, color:S.textMuted }}>{fmt(r.deltaStock)}</span>
                </div>)}
              </div>
              <div style={{ display:'flex', gap:12, flexWrap:'wrap', marginTop:12 }}>
                {[['Volume',`${fmt(currentStock.volume,1)} m³`],['BEF',`${BEF}`],['R:S',`${R2S}${browsedScrub&&browsingEvidence.trim()?' / 1.07':''}`],['CF',`${CF}`],['44/12',`${STOICH.toFixed(3)}`],['Density factor',`${densityFactor.toFixed(2)}`],['SPF',`${spf.toFixed(2)}`]].map(([k,v])=><div key={k}><div style={{ fontSize:9, color:S.textDim, textTransform:'uppercase', marginBottom:2 }}>{k}</div><div style={{ fontFamily:S.font, fontSize:11, color:S.textMuted }}>{v}</div></div>)}
              </div>
            </div>

            <div style={{ paddingTop:14 }}>
              <Label style={{ display:'block', marginBottom:8 }}>Deductions for this vintage</Label>
              <LedgerRow label="Baseline change" note={`max(0, ${fmt(baselineChange)} tCO₂e)`} value={`−${fmt(baselineDeduction)}`} />
              <LedgerRow label="Fuel combustion" note={`${fuelLiters} L · ${fuelFactor===null?'factor missing':fuelFactorLabel}`} value={projectFuelEmissions===null?'Pending':`−${fmt(projectFuelEmissions)}`} />
              <LedgerRow label="Soil disturbance" note={vintageYear===5&&soilType!=='none'?`${soilFactor*100}% on ${fmt(disturbedArea,1)} disturbed ha`:'Not applicable this vintage'} value={`−${fmt(soilDeduction)}`} />
              {vintageYear===5&&clearedDryTonnes>0&&<LedgerRow label="Pre-project biomass clearance" note={`${fmt(clearedAGB,1)} t AGB + ${fmt(clearedBGB,1)} t BGB`} value={`−${fmt(clearanceEmission)}`} />}
              {vintageYear===5&&burned&&clearedDryTonnes>0&&<LedgerRow label="Additional burning emissions" note="Tier 1 CH₄/N₂O factor" value={burningExtraEmissions===null?'Pending':`−${fmt(burningExtraEmissions)}`} />}
              {displacedLivestock>0&&<LedgerRow label="Activity-shifting leakage" note={safeHarborValid?'Safe harbour evidenced':`10-year default · ${livestockEFNum===null?'factor missing':`${fmt(livestockEFNum,4)} tCO₂e/head/year`}`} value={activityLeakage===null?'Pending':`−${fmt(activityLeakage)}`} />}
              {marketLeakageApplies&&<LedgerRow label="Market leakage" note={`LF ${marketLFNum===null?'pending':`${(marketLFNum*100).toFixed(1)}%`}`} value={marketLeakage===null?'Pending':`−${fmt(marketLeakage)}`} color={S.blue} />}
              <div style={{ display:'flex', justifyContent:'space-between', padding:'12px 0', borderBottom:`1px solid ${S.borderStrong}`, marginTop:4, gap:10 }}>
                <span style={{ fontSize:12, color:S.textMuted, fontWeight:600 }}>Positive balance before buffer and uncertainty</span>
                <span style={{ fontFamily:S.font, fontSize:14, color:S.text }}>{preBufferBalance===null?'Pending':`${fmt(preBufferBalance)} tCO₂e`}</span>
              </div>
              <LedgerRow label="Buffer volume withheld" note={`Rate ${bufferRate}% · applied before uncertainty`} value={bufferVolume===null?'Pending':`−${fmt(bufferVolume)}`} color={S.amber} />
              <LedgerRow label="Uncertainty deduction" note={uncertaintyRatesComplete?`Approved schedule · ${uncertaintyScheduleRef}`:'Rates and schedule reference required'} value={uncertaintyDeduction===null?'Pending':`−${fmt(uncertaintyDeduction)}`} color={S.amber} />
              <LedgerRow label="Previous deficit carryover" note="Deducted after this vintage's net removals" value={`−${fmt(prevDeficit)}`} color={S.red} />
            </div>

            <div style={{ marginTop:18, background:S.surface, border:`1px solid ${S.border}`, borderRadius:8, padding:'18px 20px', boxShadow:'0 1px 3px rgba(0,0,0,0.04)' }}>
              <Label style={{ display:'block', marginBottom:8, color:S.textMuted }}>Indicative vintage balance after deficit</Label>
              {netBeforeCarryover===null ? <div style={{ fontSize:13, color:S.amber, lineHeight:1.5 }}>Complete the required uncertainty schedule and emission-factor inputs to calculate a final vintage balance.</div> : resultScreenPasses ? <>
                <div style={{ display:'flex', alignItems:'baseline', gap:8 }}>
                  <span style={{ fontFamily:S.fontHead, fontSize:38, color:provisionalUnits>0?S.accent:S.red, letterSpacing:'-0.04em', lineHeight:1 }}>{fmt(provisionalUnits,2)}</span>
                  <span style={{ fontSize:12, color:S.textMuted }}>tCO₂e</span>
                </div>
                <div style={{ marginTop:8, fontSize:11, color:S.textMuted }}>Net vintage balance after required deductions and any carried-forward deficit. Not an issuance approval.</div>
                <div style={{ display:'flex', justifyContent:'space-between', marginTop:14, paddingTop:12, borderTop:`1px solid ${S.border}`, gap:10 }}><span style={{ fontSize:11, color:S.textMuted }}>Deficit to carry forward</span><span style={{ fontFamily:S.font, fontSize:12, color:newDeficit>0?S.red:S.text }}>{fmt(newDeficit)} tCO₂e</span></div>
              </> : <div style={{ fontSize:13, color:S.red, lineHeight:1.5 }}>No units may be treated as eligible while the screening issues below remain unresolved.</div>}
              <div style={{ marginTop:14, display:'flex', gap:10, flexWrap:'wrap' }}>
                <Pill color={S.amber} bg={S.amberDim}>VVB review required</Pill>
                <Pill color={S.amber} bg={S.amberDim}>Registry approval required</Pill>
              </div>
            </div>

            {missingInputs.length>0 && <div style={{ marginTop:14, padding:'12px 14px', background:S.amberDim, border:`1px solid ${S.amber}35`, borderRadius:6 }}>
              <div style={{ fontSize:11, fontWeight:700, color:S.amber, marginBottom:7 }}>Required inputs missing</div>
              <ul style={{ margin:0, paddingLeft:18, fontSize:11, color:S.textMuted, lineHeight:1.6 }}>{missingInputs.map((item,i)=><li key={i}>{item}</li>)}</ul>
            </div>}
            {screenIssues.length>0 && <div style={{ marginTop:14, padding:'12px 14px', background:S.redDim, border:`1px solid ${S.red}30`, borderRadius:6 }}>
              <div style={{ fontSize:11, fontWeight:700, color:S.red, marginBottom:7 }}>Screening issues</div>
              <ul style={{ margin:0, paddingLeft:18, fontSize:11, color:S.textMuted, lineHeight:1.6 }}>{screenIssues.map((item,i)=><li key={i}>{item}</li>)}</ul>
            </div>}

            <button onClick={exportResults} style={{ marginTop:14, width:'100%', padding:'10px 0', background:S.surface, border:`1px solid ${S.borderStrong}`, borderRadius:6, fontFamily:S.fontSans, fontSize:12, fontWeight:600, color:S.textMuted, cursor:'pointer' }}>
              ↓ Export calculation record (JSON)
            </button>
            <div style={{ marginTop:10, fontSize:10, color:S.textDim, lineHeight:1.55 }}>The export records the inputs, factors, deductions and screening issues. The Registry and VVB must confirm the underlying data, eligibility and final issuance separately.</div>
          </div>
        </div>
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script></body></html>
